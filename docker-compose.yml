version: '3.7'

services:
  app:
    image: 127.0.0.1:5000/api-masdiag-production:latest
    hostname: api-masdiag-production
    build:
      context: .
      args:
        RAILS_MASTER_KEY: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        RAILS_ENV: production
    expose:
      - "3000"
    restart:
        unless-stopped
    environment:
      RAILS_LOG_TO_STDOUT: 'true'
      RAILS_SERVE_STATIC_FILES: 'true'
      RAILS_ENV: production
    ports:
      - "3000:3000"    


        

