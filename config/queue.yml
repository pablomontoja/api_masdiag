default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 100
  workers:
    - queues: [ mailers ]
      threads: 1
      processes: 1
      polling_interval: 1  
    - queues: "*"
      threads: 1
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 2) %>
      polling_interval: 0.5
    
    

development:
 <<: *default

test:
 <<: *default

staging:
 <<: *default

production:
 <<: *default
