version: '3.5'

services:
  app:    
    hostname: api-masdiag-production
    image: 127.0.0.1:5000/api-masdiag-production:latest
    command: sh -c "rails s -p 3000 -b '0.0.0.0' -e production"
    # volumes:
    #   - "/storage/rails/api-masdiag-production/log:/app2/log"
    environment:
      RAILS_LOG_TO_STDOUT: 'true'
      RAILS_SERVE_STATIC_FILES: 'true'
      RAILS_ENV: production
    networks:
      - traefik
    deploy:
      labels:
        - traefik.enable=true        
        - traefik.http.middlewares.redirect-web-secure.redirectscheme.scheme=https
        - traefik.http.routers.api-masdiag.middlewares=redirect-web-secure
        - traefik.http.routers.api-masdiag.entrypoints=web      
        - traefik.http.routers.api-masdiag.rule=Host(`api.masdiag.pl`)
        - traefik.http.routers.api-masdiag-secure.tls=true
        - traefik.http.routers.api-masdiag-secure.tls.certresolver=myresolver
        - traefik.http.routers.api-masdiag-secure.entrypoints=websecure
        - traefik.http.routers.api-masdiag-secure.rule=Host(`api.masdiag.pl`)
        - traefik.http.services.api-masdiag-secure.loadbalancer.server.port=3000
        - traefik.http.services.api-masdiag-secure.loadbalancer.sticky.cookie=true
        - traefik.http.services.api-masdiag-secure.loadbalancer.sticky.cookie.secure=true
        - traefik.docker.network=webgateway
      # placement:
      #   constraints: [node.role == worker]
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
      placement:
        constraints: 
          - node.role == worker
          - node.platform.arch == x86_64

networks:
  traefik:
    name: webgateway
    external: true


